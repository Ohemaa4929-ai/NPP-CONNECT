<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NPP CONNECT</title>
<style>
:root{--red:#d7141a;--blue:#16307b;--bg:#fff;--bg2:#f2f4f8;--tx:#14181f;--mut:#6b7280;--bd:#e3e6ec;--me:#dfe8ff;--them:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141c;--bg2:#171c27;--tx:#eef1f6;--mut:#98a1b3;--bd:#262d3b;--me:#233a7a;--them:#1d2331}}
:root[data-theme=dark]{--bg:#10141c;--bg2:#171c27;--tx:#eef1f6;--mut:#98a1b3;--bd:#262d3b;--me:#233a7a;--them:#1d2331}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,body{height:100%;background:var(--bg2);color:var(--tx)}
#app{height:100%;max-width:480px;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
header{background:var(--blue);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--red)}
header h1{font-size:17px;flex:1;letter-spacing:.5px}
.ib{background:none;border:0;color:inherit;font-size:20px;padding:6px;min-width:44px;min-height:44px;cursor:pointer}
main{flex:1;overflow-y:auto;background:var(--bg)}
nav{display:flex;border-top:1px solid var(--bd);background:var(--bg)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font-size:11px;min-height:56px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--red);font-weight:600}
.demo{background:#fff4c2;color:#5b4a00;font-size:12px;text-align:center;padding:4px}
.row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd);align-items:center;cursor:pointer;min-height:64px}
.av{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.row .m{flex:1;min-width:0}.row .n{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.row .p{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{color:var(--mut);font-size:12px;font-weight:400}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px}
.ver{color:#1a73e8;font-size:13px}
.card{margin:12px;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--bg2)}
.card.hi{border-left:5px solid var(--red)}
.card h3{font-size:16px;margin:4px 0}.card p{font-size:14px;line-height:1.45}
.tag{font-size:11px;color:var(--mut)}
.chat{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.msgs{flex:1;overflow-y:auto;padding:10px;background:var(--bg2);display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 10px;border-radius:12px;background:var(--them);font-size:15px;line-height:1.4;word-wrap:break-word;align-self:flex-start;cursor:pointer}
.b.me{background:var(--me);align-self:flex-end}
.b .meta{font-size:11px;color:var(--mut);text-align:right;margin-top:2px}
.tick.r{color:#1a73e8}
.q{border-left:3px solid var(--red);padding:2px 6px;margin-bottom:4px;font-size:13px;color:var(--mut);background:rgba(128,128,128,.12);border-radius:4px}
.rx{font-size:13px;margin-top:2px}
.bar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd);align-items:center;background:var(--bg)}
.bar input[type=text],.sf{flex:1;min-width:0;border:1px solid var(--bd);border-radius:22px;padding:11px 14px;font-size:16px;background:var(--bg2);color:var(--tx)}
.send{background:var(--red);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
.file{display:flex;gap:8px;align-items:center}.file i{font-style:normal;font-size:24px}
.vn{display:flex;align-items:center;gap:8px;min-width:150px}.vn .pb{flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}.vn .pb s{display:block;height:100%;width:0;background:var(--red)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheet button{display:block;width:100%;text-align:left;padding:14px;border:0;background:none;font-size:16px;color:var(--tx);min-height:48px;cursor:pointer}
.emo{display:flex;justify-content:space-around;font-size:28px;padding-bottom:6px}.emo span{cursor:pointer;padding:6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.f{width:100%;border:1px solid var(--bd);border-radius:10px;padding:11px;font-size:16px;background:var(--bg2);color:var(--tx)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;width:100%;margin-top:14px;min-height:48px;cursor:pointer}
.btn.red{background:var(--red)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90%}
.login{padding:30px 22px;text-align:center}.logo{width:84px;height:84px;border-radius:50%;margin:10px auto;background:linear-gradient(var(--red) 33%,#fff 33% 66%,var(--blue) 66%);border:3px solid var(--blue);display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:20px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const ini=n=>n.replace('Demo ','').split(' ').map(w=>w[0]).slice(0,2).join('');
let S={user:null,role:'Grassroots Member',tab:'chats',open:null,reply:null,search:false,rec:null,toast:'',
 chats:[
  {id:'c1',name:'Demo Regional Leader',ver:1,msgs:[{id:1,f:'t',k:'text',x:'Good morning. Please confirm attendance for Saturday.',t:'08:10'}]},
  {id:'c2',name:'Demo Constituency Executive',ver:1,msgs:[{id:1,f:'t',k:'text',x:'Welcome to the constituency channel.',t:'Yesterday'}]},
  {id:'c3',name:'Demo Electoral Coordinator',msgs:[]}],
 groups:[
  {id:'g1',name:'Demo Constituency Group',n:240,msgs:[{id:1,f:'t',who:'Demo Member A',k:'text',x:'Meeting starts at 10am.',t:'09:02'}]},
  {id:'g2',name:'Demo Polling Station Team',n:18,lock:1,msgs:[{id:1,f:'t',who:'Demo Member B',k:'text',x:'Confidential group: forwarding is disabled.',t:'Mon'}]}],
 feed:[{id:1,title:'Important Leadership Update',x:'Welcome to NPP CONNECT. This is a demonstration of the leadership broadcast system.',by:'Demo National Leader',aud:'Demo Members',pri:'High',t:'Today',views:128,fwd:1}]};
const LEADERS={'National Leader':'Everyone','Regional Leader':'Region','Constituency Executive':'Constituency'};
const list=()=>S.chats.concat(S.groups);
const cur=()=>list().find(c=>c.id===S.open);
function toast(m){S.toast=m;draw();setTimeout(()=>{S.toast='';draw()},2200)}
function login(){
 app.innerHTML=`<div class="demo">DEMO MODE · fictional accounts only</div><div class="login"><div class="logo">NPP</div><h2>NPP CONNECT</h2><p class="t">Connecting Leadership to the Grassroots</p>
 <label style="text-align:left">Ghana phone number</label><input class="f" id="ph" inputmode="tel" placeholder="+233 24 000 0000" maxlength="16">
 <div id="otpw" style="display:none"><label style="text-align:left">6-digit code (demo code: 123456)</label><input class="f" id="otp" inputmode="numeric" maxlength="6"></div>
 <div class="err" id="er"></div><button class="btn" id="go">Send code</button></div>`;
 let step=1;$('#go').onclick=()=>{
  const p=$('#ph').value.replace(/[\s-]/g,''),er=$('#er');
  if(step===1){ if(!/^(\+233|0)[235]\d{8}$/.test(p)){er.textContent='Enter a valid Ghana number, e.g. +233 24 000 0000.';return}
   er.textContent='';$('#otpw').style.display='block';$('#go').textContent='Verify and enter';step=2;return}
  if($('#otp').value!=='123456'){er.textContent='Wrong code. Please try again.';return}
  S.user='Demo Member';S.open=null;draw()}}
function tick(m){return m.f==='me'?`<span class="tick ${m.st==2?'r':''}">${m.st==0?'✓':'✓✓'}</span>`:''}
function body(m,c){
 let h='';if(m.q)h+=`<div class="q">${esc(m.q)}</div>`;
 if(c.who===undefined&&0){}
 if(m.who&&m.f==='t')h+=`<div class="tag">${esc(m.who)}</div>`;
 if(m.k==='text')h+=esc(m.x);
 if(m.k==='file')h+=`<div class="file"><i>📄</i><div>${esc(m.x)}<div class="tag">${esc(m.sz)}</div></div></div>`;
 if(m.k==='voice')h+=`<div class="vn"><button class="ib" data-a="play" data-i="${m.id}" style="min-width:32px;min-height:32px;padding:0">▶</button><div class="pb"><s id="p${m.id}"></s></div><span class="tag">0:${String(m.x).padStart(2,'0')}</span></div>`;
 return h+`<div class="meta">${m.t} ${tick(m)}</div>`+(m.r?`<div class="rx">${m.r}</div>`:'')}
function chatView(){
 const c=cur(),q=($('#sf')&&$('#sf').value||'').toLowerCase();
 const ms=c.msgs.filter(m=>!m.del&&(!q||String(m.x).toLowerCase().includes(q)));
 return `<div class="chat"><header><button class="ib" data-a="back">←</button><div class="av" style="width:36px;height:36px;font-size:13px">${esc(ini(c.name))}</div><h1 style="font-size:15px">${esc(c.name)}${c.ver?' <span class="ver">✔</span>':''}${c.lock?' 🔒':''}</h1><button class="ib" data-a="srch">🔍</button></header>
 ${S.search?'<div class="bar"><input class="sf" id="sf" placeholder="Search in conversation" type="search"></div>':''}
 <div class="msgs" id="ms">${ms.length?ms.map(m=>`<div class="b ${m.f==='me'?'me':''}" data-a="msg" data-i="${m.id}">${body(m,c)}</div>`).join(''):'<div class="empty">No messages yet. Say hello.</div>'}</div>
 ${S.reply?`<div class="bar"><div class="q" style="flex:1">Replying: ${esc(S.reply.slice(0,60))}</div><button class="ib" data-a="noreply">✕</button></div>`:''}
 ${S.rec!==null?`<div class="bar"><button class="ib" data-a="cancelrec">🗑</button><div style="flex:1;color:var(--red)">● Recording 0:${String(S.rec).padStart(2,'0')}</div><button class="send" data-a="sendrec">➤</button></div>`
 :`<div class="bar"><label class="ib" style="margin:0;cursor:pointer">📎<input type="file" id="fl" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg" hidden></label><input type="text" id="in" placeholder="Message" maxlength="2000" autocomplete="off"><button class="ib" data-a="rec">🎤</button><button class="send" data-a="send">➤</button></div>`}</div>`}
function tabView(){
 const t=S.tab;
 if(t==='chats')return list0(S.chats);
 if(t==='groups')return list0(S.groups);
 if(t==='home'||t==='bc'){
  let h=t==='bc'&&LEADERS[S.role]?composer():(t==='bc'?`<div class="card"><h3>Broadcasts</h3><p>Only authorized leaders can publish. Switch role in Profile to try the composer.</p></div>`:'');
  h+=`<div class="tag" style="padding:10px 14px 0">OFFICIAL ANNOUNCEMENTS</div>`;
  return h+(S.feed.length?S.feed.map(b=>`<div class="card ${b.pri==='High'?'hi':''}"><div class="tag">${esc(b.by)} <span class="ver">✔ Verified</span> · ${esc(b.t)}</div><h3>${esc(b.title)}</h3><p>${esc(b.x)}</p><div class="tag" style="margin-top:8px">Audience: ${esc(b.aud)} · Priority: ${esc(b.pri)} · 👁 ${b.views}</div></div>`).join(''):'<div class="empty">No announcements.</div>')}
 if(t==='me')return `<div class="login"><div class="av" style="width:80px;height:80px;margin:auto;font-size:26px">DM</div><h2 style="margin-top:8px">Demo Member</h2><p class="t">${esc(S.role)} · Demo Region · Demo Constituency</p>
  <label style="text-align:left">Demo role (tests permissions)</label><select class="f" id="role">${['Grassroots Member','Polling Station Executive','Constituency Executive','Regional Leader','National Leader'].map(r=>`<option ${r===S.role?'selected':''}>${r}</option>`).join('')}</select>
  <button class="btn" data-a="theme">Toggle dark / light</button><button class="btn red" data-a="logout">Log out</button></div>`}
function list0(a){return a.length?a.map(c=>{const l=c.msgs.filter(m=>!m.del).slice(-1)[0];return `<div class="row" data-a="open" data-i="${c.id}"><div class="av">${esc(ini(c.name))}</div><div class="m"><div class="n"><span>${esc(c.name)}${c.ver?' <span class="ver">✔</span>':''}${c.lock?' 🔒':''}</span><span class="t">${l?l.t:''}</span></div><div class="p">${l?esc(l.k==='text'?l.x:l.k==='voice'?'🎤 Voice message':'📄 '+l.x):'No messages yet'}</div></div>${c.un?`<span class="badge">${c.un}</span>`:''}</div>`}).join(''):'<div class="empty">No conversations yet.</div>'}
function composer(){const aud=LEADERS[S.role];return `<div class="card"><h3>Create broadcast</h3><label>Title</label><input class="f" id="bt" maxlength="100"><label>Message</label><textarea class="f" id="bm" rows="3" maxlength="1000"></textarea><label>Audience (limited to your role)</label><select class="f" id="ba">${S.role==='National Leader'?'<option>Everyone</option><option>Region</option><option>Constituency</option>':S.role==='Regional Leader'?'<option>Region</option><option>Constituency</option>':'<option>Constituency</option>'}</select><label>Priority</label><select class="f" id="bp"><option>Normal</option><option>High</option></select><button class="btn red" data-a="pub">Publish</button></div>`}
function draw(){
 if(!S.user)return login();
 const tabs=[['home','🏠','Home'],['chats','💬','Chats'],['groups','👥','Groups'],['bc','📢','Broadcasts'],['me','👤','Profile']];
 const keep=$('#in')?$('#in').value:'';
 app.innerHTML=`<div class="demo">DEMO MODE · fictional data</div><header><h1>NPP CONNECT</h1><button class="ib" data-a="note">🔔</button></header><main>${tabView()}</main><nav>${tabs.map(t=>`<button data-a="tab" data-i="${t[0]}" class="${S.tab===t[0]?'on':''}"><b>${t[1]}</b>${t[2]}</nav>`.replace('</nav>','</button>')).join('')}</nav>${S.open?chatView():''}${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}`;
 const ms=$('#ms');if(ms)ms.scrollTop=ms.scrollHeight;
 if($('#in')){$('#in').value=keep;$('#in').onkeydown=e=>{if(e.key==='Enter')act('send')}}
 if($('#sf'))$('#sf').oninput=()=>{const p=$('#sf').value;draw();$('#sf').value=p;$('#sf').focus()};
 if($('#fl'))$('#fl').onchange=upload;
 if($('#role'))$('#role').onchange=e=>{S.role=e.target.value;draw()}}
function add(c,m){m.id=Date.now()+Math.random();m.t=now();c.msgs.push(m);return m}
function deliver(c,m){setTimeout(()=>{m.st=1;draw()},600);setTimeout(()=>{m.st=2;draw()},1500);
 if(!c.who&&!c.lock&&c.id[0]==='c')setTimeout(()=>{add(c,{f:'t',k:'text',x:'Received. Thank you.'});if(S.open!==c.id)c.un=(c.un||0)+1;draw()},2600)}
function send(c,m){m.f='me';m.st=0;if(S.reply){m.q=S.reply;S.reply=null}add(c,m);deliver(c,m);draw()}
function upload(e){const f=e.target.files[0];if(!f)return;
 if(f.size>5*1024*1024)return toast('File too large. Maximum is 5 MB.');
 if(!/\.(pdf|docx?|xlsx?|png|jpe?g)$/i.test(f.name))return toast('This file type is not allowed.');
 send(cur(),{k:'file',x:f.name.slice(0,60),sz:(f.size/1024).toFixed(0)+' KB'})}
let timer=null,sel=null;
function act(a,i){
 const c=cur();
 if(a==='tab'){S.tab=i;draw()}
 else if(a==='open'){S.open=i;S.search=false;const x=cur();x.un=0;draw()}
 else if(a==='back'){S.open=null;S.reply=null;S.search=false;clearInterval(timer);S.rec=null;draw()}
 else if(a==='srch'){S.search=!S.search;draw()}
 else if(a==='send'){const v=$('#in').value.trim();if(!v)return;send(c,{k:'text',x:v})}
 else if(a==='rec'){S.rec=0;timer=setInterval(()=>{S.rec++;if(S.rec>=120)act('sendrec');else draw()},1000);draw()}
 else if(a==='cancelrec'){clearInterval(timer);S.rec=null;draw()}
 else if(a==='sendrec'){clearInterval(timer);const d=Math.max(S.rec,1);S.rec=null;send(c,{k:'voice',x:d})}
 else if(a==='play'){const el=$('#p'+i);if(!el)return;el.style.transition='width 3s linear';el.style.width='100%'}
 else if(a==='noreply'){S.reply=null;draw()}
 else if(a==='msg'){sel=c.msgs.find(m=>String(m.id)===i);if(!sel)return;
  const o=document.createElement('div');o.className='sheet';
  o.innerHTML=`<div><div class="emo">${['👍','❤️','😂','🙏'].map(e=>`<span data-e="${e}">${e}</span>`).join('')}</div><button data-s="reply">↩ Reply</button>${sel.k==='text'?'<button data-s="copy">Copy</button>':''}${c.lock?'':'<button data-s="fwd">Forward</button>'}${sel.f==='me'?'<button data-s="del" style="color:var(--red)">Delete</button>':'<button data-s="rep">Report</button>'}</div>`;
  o.onclick=e=>{const t=e.target;
   if(t.dataset.e){sel.r=t.dataset.e}
   else if(t.dataset.s==='reply'){S.reply=String(sel.x)}
   else if(t.dataset.s==='copy'){try{navigator.clipboard.writeText(sel.x)}catch(_){}}
   else if(t.dataset.s==='del'){if(confirm('Delete this message?'))sel.del=1;else return}
   else if(t.dataset.s==='rep'){o.remove();return toast('Reported to moderators.')}
   else if(t.dataset.s==='fwd'){o.remove();return toast('Forward is a demo action.')}
   else if(t!==o)return;
   o.remove();draw()};
  app.appendChild(o)}
 else if(a==='pub'){
  const t=$('#bt').value.trim(),m=$('#bm').value.trim();
  if(!LEADERS[S.role])return toast('You do not have permission to broadcast.');
  if(!t||!m)return toast('Add a title and a message.');
  S.feed.unshift({id:Date.now(),title:t,x:m,by:'Demo '+S.role,aud:$('#ba').value,pri:$('#bp').value,t:'Just now',views:0});S.tab='home';draw();toast('Broadcast published.')}
 else if(a==='theme'){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#fff';r.dataset.theme=d?'dark':'light';draw()}
 else if(a==='logout'){S.user=null;S.open=null;draw()}
 else if(a==='note')toast('No new notifications.')}
app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&!t.closest('.sheet'))act(t.dataset.a,t.dataset.i)});
draw();
</script></body></html>
